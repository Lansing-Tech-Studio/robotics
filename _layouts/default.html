<!DOCTYPE html>
<!-- Overrides the remote theme's default layout to add the workshops-style
     sidebar nav. Everything else — page.html, home.html, post.html, site.css —
     still comes from lts-team-blog-theme; nav.css only adds the sidebar. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  {% if page.excerpt %}<meta name="description" content="{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}">
  {% elsif site.description %}<meta name="description" content="{{ site.description }}">{% endif %}
  <link rel="stylesheet" href="{{ '/assets/style/site.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/style/syntax.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/style/nav.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="header-content">
      <a href="{{ site.url }}" class="site-logo">
        <img src="{{ '/assets/images/logo-transparent.png' | relative_url }}" alt="Lansing Tech Studio" class="logo-img">
        <span class="site-title">{{ site.parent_title | default: site.title }}</span>
      </a>
      <button class="nav-toggle" aria-label="Toggle navigation">
        <span class="hamburger"></span>
      </button>
    </div>
  </header>

  <div class="page-wrapper">
    <nav class="sidebar" id="sidebar">
      {% include nav.html %}
    </nav>

    <main class="main-content">
      <article class="content">
        {{ content }}
      </article>
    </main>
  </div>

  <footer class="site-footer">
    <p>{{ site.title }} &middot; &copy; {{ 'now' | date: "%Y" }} <a href="https://lansingtechstudio.org">Lansing Tech Studio</a></p>
    {% if site.repo_url %}<p><a href="{{ site.repo_url }}">Edit this site on GitHub</a></p>{% endif %}
  </footer>

  <script>
    document.querySelector('.nav-toggle').addEventListener('click', function () {
      document.getElementById('sidebar').classList.toggle('open');
      this.classList.toggle('active');
    });

    document.querySelectorAll('.nav-toggle-btn').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.preventDefault();
        var expanded = this.closest('.nav-item').classList.toggle('expanded');
        this.setAttribute('aria-expanded', expanded);
      });
    });

    // Open the section the current page lives in.
    document.querySelectorAll('.nav-item.has-subnav').forEach(function (navItem) {
      if (navItem.classList.contains('active') || navItem.querySelector('.nav-subnav .active')) {
        navItem.classList.add('expanded');
        var btn = navItem.querySelector('.nav-toggle-btn');
        if (btn) btn.setAttribute('aria-expanded', 'true');
      }
    });
  </script>
</body>
</html>
