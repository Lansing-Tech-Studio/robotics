title: Lansing Tech Studio Robotics
description: Robotics teams at Lansing Tech Studio — find each team's blog here.
url: "https://lansingtechstudio.org"
baseurl: "/robotics"
repo_url: "https://github.com/Lansing-Tech-Studio/robotics"

# Same shared theme the team blogs use, so the hub and the team sites look
# like one family. See Lansing-Tech-Studio/lts-team-blog-theme.
remote_theme: Lansing-Tech-Studio/lts-team-blog-theme@v1

nav:
  - title: Lansing Tech Studio
    url: https://lansingtechstudio.org

markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
