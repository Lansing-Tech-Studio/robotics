# Team rosters, used only by /roster.html to print lanyard name tags.
#
# Names are committed to this public repo — see the note in teams.yml about
# keeping rosters off pages the teams don't control. The tag only ever prints
# "First L.", so keep last names abbreviated here too.
#
# `image` is the team's tag artwork (2.375in wide at print size, so ~700px
# wide is plenty; the robot art is ~785px square).
#
# `color` tints the tag border and the name. It must never be the only thing
# telling teams apart — the per-team shape that does that work is drawn into
# the robot artwork, so it lives in the PNGs, not here. Canonical color/shape
# table and the reasoning: see "Team colors and shapes" in README.md.

