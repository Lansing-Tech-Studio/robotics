# Regionals day schedule, shown on /schedule.html. Copied from the schedule
# sheets handed out in each team's folder at check-in.
#
# `common` is the competition-wide part, the same for every team.
#
# `teams` holds each team's own sheet. `slug` must match the team's slug in
# roster.yml (the page takes the name, FIRST number and color from there).
# `event_number` is the "Team #" the event assigned for the day, which is not
# the FIRST team number.
#
# Only teams whose sheet has been entered are listed (the four FLL Challenge
# teams); add others in the same shape.

note: >-
  All times are our best estimates. Try to be early for each event, but times
  may slip due to unforeseen circumstances.

common:
  - time: "8:00 - 8:15 AM"
    event: Coaches Meeting
  - time: "9:00 - 9:15 AM"
    event: Opening Ceremonies
  - time: "12:25 - 1:10 PM"
    event: Lunch - no robot games or judging
  - time: "4:00 - 4:30 PM"
    event: Break down pit, pack out
  - time: "4:30 PM"
    event: Awards Ceremony

teams:
