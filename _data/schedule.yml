# Regionals day schedule, shown on /schedule.html. Copied from the schedule
# sheets handed out in each team's folder at check-in.
#
# `common` is the competition-wide part, the same for every team.
#
# Every event has `time` (as printed on the sheet) and `at`, its start time in
# 24-hour HH:MM. `at` is what the grid view sorts its columns by and uses to
# line events up, so it must be zero-padded ("09:20", not "9:20").
#
# `teams` holds each team's own sheet. `slug` must match the team's slug in
# roster.yml (the page takes the name, FIRST number and color from there).
# `event_number` is the "Team #" the event assigned for the day, which is not
# the FIRST team number.
#
# Only teams whose sheet has been entered are listed (the four FLL Challenge
# teams); add others in the same shape.

note: >-
  All times are our best estimates. Try to be early for each event, but times
  may slip due to unforeseen circumstances.

# `coach_notes` are the notes from the morning coaches meeting, listed at the
# bottom of the page.
coach_notes:
  - Anna is the head ref, the same person as last year at Waverly.
  - Bubbles on mats - if you notice something, tell the ref.
  - Know the team number.
  - Show up 5 minutes early for matches.
  - Show up 10 minutes early for judging. Make sure you have your robot.
  - 22 teams.
  - Mats are taped where it is allowed.
  - The ant butt is cosmetic.
  - A football-style list sheet (a play armband like a quarterback wears) is good.
  - Video will be uploaded in a week.
  - All parents and coaches need to be behind the rail. Team members need to be at the table or behind the line.

common:
  - time: "8:00 - 8:15 AM"
    at: "08:00"
    event: Coaches Meeting
  - time: "9:00 - 9:15 AM"
    at: "09:00"
    event: Opening Ceremonies
  - time: "12:25 - 1:10 PM"
    at: "12:25"
    event: Lunch - no robot games or judging
  - time: "4:00 - 4:30 PM"
    at: "16:00"
    event: Break down pit, pack out
  - time: "4:30 PM"
    at: "16:30"
    event: Awards Ceremony

