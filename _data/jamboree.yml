# FLL Explore jamboree schedule, shown on /jamboree.html. Copied from the
# "Team Schedule" sheet handed out at the event.
#
# The sheet gives clock times only for the two ceremonies. Rotations have no
# set times (see `note`), so they are listed in order, not by the clock.
#
# Our teams are not marked here: the page highlights any team whose `number`
# matches a FIRST team number in roster.yml, and shows the roster's name next
# to the one printed on the sheet. `our_group` is the group those teams are in.

name: Wolfpack Robo Jamboree 2026
our_group: B

opening:
  event: Opening Ceremonies
  room: Auditorium
  time: "9:00 AM"

closing:
  event: Closing Ceremonies
  room: Auditorium
  time: "Approximately 11:45 AM"

note: >-
  Rotations will be approximately 30-45 minutes. Please keep your team in their
  designated rotation until the scheduler releases them.

# `key` is what each rotation below uses to name the station.
stations:
  - key: reviewing
    name: Reviewing and free build
    room: Gym
    description: Teams will wait their turn to be reviewed (interviewed by event volunteers).
  - key: stem
    name: STEM Stations
    room: Cafeteria
    description: There will be plenty of STEM activities to keep teams busy.
  - key: demos
    name: Robot Demonstrations
    room: Library
    description: >-
      Robots from the LEGO Challenge, middle school, and the high school robot,
      Grapefruit, will be interacting with teams.

# Which group is at each station, one entry per rotation, in order.
rotations:
  - reviewing: A
    stem: B
    demos: C
  - reviewing: C
    stem: A
    demos: B
  - reviewing: B
    stem: C
    demos: A

# `name` is the team name as printed on the sheet.
groups:
