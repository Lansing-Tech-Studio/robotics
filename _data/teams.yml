# Every card on the hub's front page comes from this file.
#
# To point a team at their blog, fill in `site:` with their GitHub Pages URL —
# it will be https://<their-github-username>.github.io/
# Until then the card reads "Blog coming soon".
#
# Rosters aren't listed here anymore: each team introduces its own members on
# the About page of their own site, which also keeps kids' names off a page
# they don't control. Previous rosters are in git history if you want them.
#
# `video:` is the team's screencast.com share link and `schematic:` an image (or
# short video) of their robot design under assets/images/. The team's own blog
# shows both on its /design/ page; here they only decide whether the card gets a
# "Project design" link.

